# Auto-provisions Prometheus as the Grafana datasource so dashboards work
# immediately after `docker compose ... up`. The uid is fixed so dashboard
# JSON can reference it by name (see grafana/dashboards/*.json).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
