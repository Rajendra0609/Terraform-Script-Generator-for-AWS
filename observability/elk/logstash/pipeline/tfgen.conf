# Logstash pipeline for TFGen backend logs.
#
# Input: Filebeat (see observability/elk/filebeat.yml). Filebeat's container
# input has already unwrapped Docker's json-file envelope, so [message] holds the
# backend's own winston JSON line, e.g.
#   {"level":"warn","message":"http_request","service":"tfgen-backend",
#    "correlationId":"…","method":"POST","path":"/api/terraform/plan",
#    "statusCode":422,"durationMs":41.2,"timestamp":"2026-10-13T14:02:11.100Z"}
#
# Output: one index per day, tfgen-logs-YYYY.MM.dd.

input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    target => "app"
    skip_on_invalid_json => true
    tag_on_failure => ["_tfgen_json_failure"]
  }

  if [app][timestamp] {
    date {
      match => ["[app][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  mutate {
    add_field => { "[service][name]" => "tfgen-backend" }
  }

  # One line per HTTP request. Tag it so Kibana can filter requests quickly.
  if [app][message] == "http_request" {
    mutate { add_tag => ["http"] }

    if [app][statusCode] >= 500 {
      mutate { add_tag => ["http_5xx"] }
    }

    # Health probes and metrics scrapes are noise. The backend logs them at debug
    # level already; drop any that slip through at a higher level.
    if [app][path] in ["/api/health", "/metrics"] and [app][statusCode] < 300 {
      drop { }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tfgen-logs-%{+YYYY.MM.dd}"
  }
}
