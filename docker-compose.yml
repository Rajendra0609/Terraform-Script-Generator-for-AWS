version: '3.9'
services:

  # ── Postgres ─────────────────────────────────────────────────────────────────
  postgres:
    image: daggu1997/tfgen_postgres:v0.0.1
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-tfgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfgen123}
      POSTGRES_DB:       ${POSTGRES_DB:-terraform_generator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tfgen} -d ${POSTGRES_DB:-terraform_generator}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend (Node / Express) ─────────────────────────────────────────────────
  backend:
    image: daggu1997/tfgen_backend:v0.0.1
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      NODE_ENV:     production
      PORT:         4000
      HOST:         0.0.0.0
      CORS_ORIGIN:  http://localhost:3000,http://127.0.0.1:3000,http://13.232.187.242:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tfgen}:${POSTGRES_PASSWORD:-tfgen123}@postgres:5432/${POSTGRES_DB:-terraform_generator}
      REDIS_URL:    redis://redis:6379
      SMTP_USER:  srirajendraprasaddaggubati@gmail.com
      SMTP_PASS:  ohul sitk qapy hmzl       # Gmail app password (16 chars)
      SMTP_FROM:  TFGen <tfgenadmin@gmail.com>
      FRONTEND_URL:  http://13.232.187.242:3000

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:5
  frontend:
    image: daggu1997/tfgen_frontend:v0.0.1
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped
    depends_on:
      - backend
volumes:
  pgdata:
  redisdata:
