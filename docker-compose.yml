version: '3.9'

# ─── Required secrets ─────────────────────────────────────────────────────────
# Copy .env.example to .env and fill in strong secrets before running.
# Generate values with: openssl rand -hex 32
# NEVER commit .env to version control.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tfgen
      POSTGRES_PASSWORD: tfgen123
      POSTGRES_DB: terraform_generator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfgen -d terraform_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://tfgen:tfgen123@postgres:5432/terraform_generator
      REDIS_URL: redis://redis:6379
      # BUG-009 fix: all three secrets are required.  Values come from the
      # .env file (see .env.example).  Docker Compose will refuse to start if
      # any of these variables is missing from the environment / .env file.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — see .env.example}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required — see .env.example}
      ENCRYPT_KEY: ${ENCRYPT_KEY:?ENCRYPT_KEY is required — see .env.example}
      TF_LSP_PATH: ${TF_LSP_PATH:-terraform-ls}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
