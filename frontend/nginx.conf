server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend container (Docker internal DNS) ───────────────────
    # The browser calls /api/... on the same origin (localhost:3000).
    # nginx forwards it to the backend service inside the Docker network.
    # This means REACT_APP_API_URL can be empty — no IP addresses needed.
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # match axios 120s timeout for long terraform ops
    }

    # ── WebSocket proxy → backend container ───────────────────────────────────
    # jobsAPI and terraformLspAPI open WebSocket connections to /ws/...
    # Upgrade headers are required for the WS handshake to succeed.
    location /ws/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;  # keep WS connections alive for long sessions
    }

    # ── SPA fallback — React Router handles all client-side routes ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Don't cache the HTML entry point ──────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
