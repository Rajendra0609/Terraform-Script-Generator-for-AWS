server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SECURITY FIX (M-01): neither the backend nor nginx previously set any
    # HTTP security headers — no CSP, no clickjacking protection, no forced
    # HTTPS upgrade, no MIME-sniffing protection anywhere except one specific
    # cache location below. These apply to every response nginx serves
    # (static assets, the SPA shell, and anything proxied through /api or
    # /ws). This is defense-in-depth alongside the equivalent helmet()
    # middleware now added in backend/server.js (see M-01 in
    # CHANGELOG_SECURITY_AUDIT_FIXES_ROUND3.md) — nginx protects the
    # frontend's own static/SPA responses; helmet protects the API responses
    # nginx proxies straight through without touching.
    #
    # NOTE: nginx only inherits `add_header` from a parent context into a
    # location block if that location defines NO add_header of its own — so
    # these are deliberately repeated verbatim inside the two location
    # blocks below that already set their own Cache-Control headers, rather
    # than assuming they'd "just apply everywhere" from here.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Backend is not the TLS terminator (that's whatever sits in front of
    # this container in production) — HSTS is still safe to send; browsers
    # only start honouring it once they've seen it over an actual HTTPS
    # connection.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    # Monaco Editor's syntax-highlighting workers load from blob: URLs; the
    # CRA build's runtime chunk needs 'self' script-src. connect-src allows
    # 'self' (same-origin /api and /ws calls) — extend this if the frontend
    # ever calls an external API directly from the browser.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # ── API proxy → backend container (Docker internal DNS) ───────────────────
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # SECURITY FIX (critical — C-10): this used to be
        # `$proxy_add_x_forwarded_for`, which APPENDS to whatever
        # X-Forwarded-For the client already sent rather than replacing it.
        # nginx here IS the true network edge (the first hop that terminates
        # the client's TCP connection), so a client-sent
        # `X-Forwarded-For: 127.0.0.1` became `127.0.0.1, <real client IP>`
        # after nginx — and Express (trusting exactly one hop via
        # `app.set('trust proxy', 1)`) resolved `req.ip` to the attacker-
        # controlled left-most value, defeating rate limiting and falsifying
        # the audit trail. Overwriting with `$remote_addr` means this header
        # always reflects the actual TCP peer nginx saw, never a value the
        # client can inject.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── WebSocket proxy → backend container ───────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        # SECURITY FIX (critical — C-10): same reasoning as /api/ above — the
        # WS upgrade handler in server.js also derives `req.ip` from this
        # header (used in its own logging), so it needs the same overwrite.
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Static JS/CSS chunks — long-lived cache (content-hashed filenames) ────
    # CRA names every chunk with a content hash, so it's safe to cache forever.
    # This also ensures chunk files are served directly without falling through
    # to the SPA fallback (which would return index.html → ChunkLoadError).
    location ~* ^/static/js/.+\.chunk\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        # SECURITY FIX (M-01): repeated here — see the note above the
        # server-level add_header block for why this can't just be inherited.
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        types { application/javascript js; }
        default_type application/javascript;
    }

    location ~* ^/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Don't cache the HTML entry point ──────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # SECURITY FIX (M-01): repeated here — see the note above the
        # server-level add_header block for why this can't just be inherited.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    # ── SPA fallback — React Router handles all client-side routes ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
