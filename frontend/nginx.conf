server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router handles all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
