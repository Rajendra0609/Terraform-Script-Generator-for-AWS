server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend container (Docker internal DNS) ───────────────────
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── WebSocket proxy → backend container ───────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Static JS/CSS chunks — long-lived cache (content-hashed filenames) ────
    # CRA names every chunk with a content hash, so it's safe to cache forever.
    # This also ensures chunk files are served directly without falling through
    # to the SPA fallback (which would return index.html → ChunkLoadError).
    location ~* ^/static/js/.+\.chunk\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        types { application/javascript js; }
        default_type application/javascript;
    }

    location ~* ^/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Don't cache the HTML entry point ──────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── SPA fallback — React Router handles all client-side routes ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
